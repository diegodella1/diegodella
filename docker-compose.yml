services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - ./.releases:/srv/diegodella:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
