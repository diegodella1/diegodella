server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;

    error_page 404 /404.html;

    # Allow agent discovery resources under .well-known
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /.well-known/agent-skills/index.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Markdown negotiation for agent requests to the homepage
    location = / {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs/api.md>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="alternate"; type="application/json"' always;
        add_header Vary "Accept" always;

        if ($http_accept ~* "text/markdown") {
            add_header Content-Type "text/markdown; charset=utf-8" always;
            rewrite ^ /index.md break;
        }

        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs/api.md>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="alternate"; type="application/json"' always;
        add_header Vary "Accept" always;

        if ($http_accept ~* "text/markdown") {
            add_header Content-Type "text/markdown; charset=utf-8" always;
            rewrite ^ /index.md break;
        }

        try_files /index.html =404;
    }

    location = /index.md {
        default_type text/markdown;
        try_files /index.md =404;
    }

    location = /docs/api.md {
        default_type text/markdown;
        try_files /docs/api.md =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location = /openapi.json {
        default_type application/openapi+json;
        try_files /openapi.json =404;
    }

    # Allow extensionless URLs to resolve to .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Exact path for admin without .html
    location = /admin {
        try_files /admin.html =404;
    }

    # Preserve the legacy thesis URL after consolidating into /thesis.html
    location = /cmoi-thesis {
        return 301 https://$host/thesis.html;
    }

    location = /cmoi-thesis.html {
        return 301 https://$host/thesis.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://192.168.1.14:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hide dotfiles except .well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Hide sensitive files
    location ~ (docker-compose\.yml|nginx\.conf)$ {
        deny all;
    }
}
