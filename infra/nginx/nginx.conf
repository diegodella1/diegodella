map $http_accept $not_found_document {
    default            /404.html;
    ~*text/markdown    /404.md;
}

map $http_cf_connecting_ip $api_client_ip {
    default    $http_cf_connecting_ip;
    ""         $remote_addr;
}

map $http_x_forwarded_proto $redirect_to_https {
    default 0;
    http    1;
}

map $http_accept $markdown_robots_header {
    default          "";
    ~*text/markdown  "noindex, follow";
}

server {
    listen 80;
    server_name diegodella.ar www.diegodella.ar;
    root /srv/diegodella/current;

    if ($redirect_to_https = 1) {
        return 301 https://diegodella.ar$request_uri;
    }

    if ($host = www.diegodella.ar) {
        return 301 https://diegodella.ar$request_uri;
    }

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;

    error_page 404 =404 $not_found_document;

    location = /404.html {
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /404.html =404;
    }

    location = /404.md {
        default_type text/markdown;
        charset utf-8;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /404.md =404;
    }

    # Allow agent discovery resources under .well-known
    location ^~ /.well-known/ {
        types {
            application/json json;
            text/markdown md;
        }
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        try_files $uri =404;
    }

    location = /.well-known/agent-skills/index.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Markdown negotiation for agent requests to the homepage
    location = / {
        types {
            text/html html;
            text/markdown md;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </.well-known/ai-catalog.json>; rel="ai-catalog", </docs/api.md>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="alternate"; type="application/json"' always;
        add_header X-Robots-Tag $markdown_robots_header always;
        add_header Vary "Accept, Accept-Encoding" always;

        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md break;
        }

        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.html {
        types {
            text/html html;
            text/markdown md;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </.well-known/ai-catalog.json>; rel="ai-catalog", </docs/api.md>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="alternate"; type="application/json"' always;
        add_header X-Robots-Tag $markdown_robots_header always;
        add_header Vary "Accept, Accept-Encoding" always;

        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md break;
        }

        try_files /index.html =404;
    }

    location = /index.md {
        default_type text/markdown;
        charset utf-8;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /index.md =404;
    }

    location = /docs/api.md {
        default_type text/markdown;
        charset utf-8;
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /docs/api.md =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /feed.xml {
        types { application/rss+xml xml; }
        default_type application/rss+xml;
        try_files /feed.xml =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /openapi.json {
        types { }
        default_type 'application/openapi+json; version=3.1';
        try_files /openapi.json =404;
    }

    # Allow extensionless URLs to resolve to .html
    location / {
        add_header Vary "Accept, Accept-Encoding" always;

        if ($http_accept ~* "text/markdown") {
            rewrite ^([^.]*[^/])$ $1.md last;
        }

        try_files $uri $uri/ $uri.html =404;
    }

    # Exact path for admin without .html
    location = /admin {
        try_files /admin.html =404;
    }

    # Preserve the legacy thesis URL after consolidating into /thesis.html
    location = /cmoi-thesis {
        return 301 https://diegodella.ar/thesis.html;
    }

    location = /cmoi-thesis.html {
        return 301 https://diegodella.ar/thesis.html;
    }

    # Preferred semantic paths redirect to the site's established flat .html
    # canonical convention. Redirect targets, not aliases, prevent duplicates.
    location = /writing {
        return 301 https://diegodella.ar/essays.html;
    }

    location = /writing/ {
        return 301 https://diegodella.ar/essays.html;
    }

    location = /work/posta {
        return 301 https://diegodella.ar/work-posta.html;
    }

    location = /work/posta/ {
        return 301 https://diegodella.ar/work-posta.html;
    }

    location = /work/roxom {
        return 301 https://diegodella.ar/work-roxom.html;
    }

    location = /work/roxom/ {
        return 301 https://diegodella.ar/work-roxom.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://192.168.1.14:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $api_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hide dotfiles except .well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Hide sensitive files
    location ~ (docker-compose\.yml|nginx\.conf)$ {
        deny all;
    }
}
